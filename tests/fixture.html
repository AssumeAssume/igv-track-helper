<!doctype html><html lang="en"><head><meta charset="utf-8"><title>IGV Track Helper — offline test fixture</title><style>
body{margin:0;font:14px system-ui;color:#243e50;background:#f5f8fa}.head{padding:22px 24px;background:white;border-bottom:1px solid #d7e0e8}.head h1{font-size:21px;margin:0 0 5px}.head p{font-size:12px;color:#6b7c89;margin:0}.controls{padding:14px 24px}button{padding:7px 12px;border:1px solid #bfd0dc;border-radius:5px;background:white;margin-right:6px}.viewer{display:block;margin:6px 24px 20px;width:890px;max-width:calc(100vw - 48px)}.note{padding:8px 24px;color:#728697;font-size:12px}
</style></head><body>
<div class="head"><h1>IGV Track Helper · group move test</h1><p>Local synthetic fixture · parallel columns + open Shadow DOM · not the KU Leuven session</p></div>
<div class="controls"><button id="mode">Select Tracks</button><button id="add">Add Track</button></div>
<div id="viewer-one" class="viewer"></div><div class="note">Select non-adjacent tracks, then drag any selected right-hand handle. The blue line marks the insertion point.</div>
<script>
window.changeEvents=0; window.orderEvents=[]; window.nativeDragStarts=0;
window.fixtureMeta=[
 ['K562_ATAC_rep1.bigWig','wig','bigwig'],
 ['GM12878_ATAC.bigWig','wig','bigwig'],
 ['K562_ATAC_rep2.bigWig','wig','bigwig'],
 ['K562_input.bigWig','wig','bigwig'],
 ['K562_H3K27ac.bigWig','wig','bigwig'],
 ['GM12878_H3K27ac.bigWig','wig','bigwig'],
 ['K562_peaks.bed','annotation','bed'],
 ['K562_RNA_reads.bam','alignment','bam'],
 ['Variants.vcf','variant','vcf'],
 ['Signal with no filename','wig','']
];
window.makeViewer=(host,meta=window.fixtureMeta,on=false,plain=false)=>{
 const root=plain?host:host.attachShadow({mode:'open'});
 root.innerHTML=`<style>
 *{box-sizing:border-box}.igv-container{font:12px Arial;background:white;border:1px solid #ccd9e2;border-radius:6px;overflow:hidden}.igv-navbar{padding:11px 12px;background:#e9f1f6;font-weight:bold;color:#486476}
 .igv-column-container{display:flex;max-height:720px;overflow-y:auto;overflow-x:hidden;align-items:flex-start}
 .igv-axis-column{width:40px;flex-shrink:0;background:#f3f7fa}.igv-axis-column>div{display:flex;align-items:center;justify-content:center;border-bottom:1px solid #dde7ee}
 .igv-column{flex:1;min-width:0}.igv-viewport{position:relative;overflow:hidden;border-bottom:1px solid #dde7ee;background:#fff}.igv-track-label{position:absolute;top:7px;left:11px;font-size:12px;z-index:1;background:#fffd;color:#38566b}
 .igv-sample-info-column,.igv-sample-name-column{width:4px;flex:none}.igv-scrollbar-column{width:7px;flex:none}.igv-track-drag-column{width:14px;flex:none}.igv-gear-menu-column{width:26px;flex:none}
 .igv-track-drag-handle{background:#d1dbe1;cursor:grab;border-top:2px solid white;border-bottom:2px solid white}.igv-track-drag-handle:hover{background:#b5c8d2}.igv-track-drag-handle.selected{background:#6bafc1}.igv-track-drag-shim{background:#f3f7fa}.igv-gear-menu-column>div{display:grid;place-items:center;border-bottom:1px solid #dde7ee;color:#7f96a6}.track-selection{display:grid}canvas{display:block}
 </style><div class="igv-container"><div class="igv-navbar">IGV · hg38 · chr11:5,200,000–5,300,000</div><div class="igv-column-container"><div class="igv-axis-column"></div><div class="igv-column"></div><div class="igv-column"></div><div class="igv-sample-info-column"></div><div class="igv-sample-name-column"></div><div class="igv-scrollbar-column"></div><div class="igv-track-drag-column"></div><div class="igv-gear-menu-column"></div></div></div>`;
 const column=root.querySelector('.igv-column-container');
 const b={trackViews:[],columnContainer:column,events:[],mode:on};let serial=0;
 b.getTrackOrder=()=>b.trackViews.filter(v=>v.track.name).map(v=>v.track.name);
 b.fireEvent=(event,args)=>{b.events.push({event,args});window.orderEvents.push({event,args});};
 // This fixture models the native igv.js parallel-column reorder contract.
 // It is a local test double, not a bundled copy of the IGV library.
 b.reorderTracks=()=>{
  if(b.failNextReorder){b.failNextReorder=false;throw new Error('Synthetic reorder failure');}
  const tier=v=>v.track.id==='ideogram'?1:v.track.id==='ruler'?2:3;
  b.trackViews.sort((a,c)=>tier(a)-tier(c)||(a.track.order||0)-(c.track.order||0));
  const cols=column.querySelectorAll('.igv-column');
  for(const tv of b.trackViews){
   column.querySelector('.igv-axis-column').append(tv.axis);
   tv.viewports.forEach((vp,i)=>cols[i].append(vp.viewportElement));
   column.querySelector('.igv-sample-info-column').append(tv.sampleInfoViewport.viewport);
   column.querySelector('.igv-sample-name-column').append(tv.sampleNameViewport.viewport);
   column.querySelector('.igv-scrollbar-column').append(tv.outerScroll);
   column.querySelector('.igv-track-drag-column').append(tv.dragHandle);
   column.querySelector('.igv-gear-menu-column').append(tv.gearContainer);
  }
 };
 b.toJSON=()=>({tracks:b.trackViews.map(v=>({...v.track.config,order:v.track.order}))});
 b.startTrackDrag=tv=>{b.dragTrack=tv;window.nativeDragStarts++;};
 b.updateTrackDrag=dest=>{
  if(!b.dragTrack||b.dragTrack===dest||['ruler','ideogram'].includes(dest.track.type))return;
  const from=b.trackViews.indexOf(b.dragTrack),to=b.trackViews.indexOf(dest);
  b.trackViews.splice(from,1);b.trackViews.splice(to,0,b.dragTrack);
  b.trackViews.forEach((v,i)=>v.track.order=i);b.reorderTracks();
 };
 b.endTrackDrag=()=>{if(b.dragTrack){b.dragTrack=null;b.fireEvent('trackorderchanged',[b.getTrackOrder()]);}};
 document.addEventListener('mouseup',()=>b.endTrackDrag());
 function cell(height){const e=document.createElement('div');e.style.height=height+'px';return e;}
 b.addTrack=([name,type,format],selectable=true,height=52)=>{
  const track={id:selectable?'track-'+(++serial):type,name,type,format,order:b.trackViews.length*10,selected:false,config:{name,type,format}};
  const tv={track,browser:b};track.trackView=tv;
  tv.axis=cell(height);tv.axis.dataset.tracktype=type;
  tv.viewports=[];
  column.querySelectorAll('.igv-column').forEach((col,i)=>{
   const vp={trackView:tv,browser:b,viewportElement:cell(height)};vp.viewportElement.className='igv-viewport';
   vp.viewportElement.dataset.trackType=type;
   const label=document.createElement('div');label.className='igv-track-label';label.textContent=name;vp.viewportElement.append(label);
   const canvas=document.createElement('canvas');canvas.width=420;canvas.height=height;canvas._data={viewport:vp};
   const ctx=canvas.getContext('2d');ctx.fillStyle=selectable?'#bddbe4':'#eef3f6';
   for(let j=0;j<420;j+=9){const h=(Math.sin(j*.1+serial)*.5+.5)*20;ctx.fillRect(j,height-h,6,h);}
   vp.viewportElement.append(canvas);col.append(vp.viewportElement);tv.viewports.push(vp);
  });
  tv.sampleInfoViewport={viewport:cell(height)};tv.sampleNameViewport={viewport:cell(height)};tv.outerScroll=cell(height);
  tv.dragHandle=cell(height);tv.dragHandle.className=['ruler','ideogram'].includes(type)?'igv-track-drag-shim':'igv-track-drag-handle igv-track-drag-handle-color';
  tv.gearContainer=cell(height);tv.gearContainer.textContent='⚙';
  for(const el of [tv.axis,...tv.viewports.map(v=>v.viewportElement),tv.sampleInfoViewport.viewport,tv.sampleNameViewport.viewport,tv.outerScroll,tv.dragHandle,tv.gearContainer])el.dataset.testTrack=track.id;
  if(selectable){
   const wrap=cell(24);wrap.className='track-selection';wrap.style.display=b.mode?'grid':'none';tv.trackSelectionContainer=wrap;
   const box=document.createElement('input');box.type='checkbox';box.name='track-select';box.id=host.id+'-'+track.id;
   const label=document.createElement('label');label.htmlFor=box.id;wrap.append(box,label);tv.axis.append(wrap);tv.box=box;
   box.addEventListener('change',e=>{e.stopPropagation();track.selected=box.checked;tv.dragHandle.classList.toggle('selected',box.checked);window.changeEvents++;});
  }
  if(!['ruler','ideogram'].includes(type)){
   tv.dragHandle.addEventListener('mousedown',e=>{e.preventDefault();b.startTrackDrag(tv);});
   tv.dragHandle.addEventListener('mouseenter',()=>b.updateTrackDrag(tv));
  }
  b.trackViews.push(tv);b.reorderTracks();return tv;
 };
 [['Ideogram','ideogram',''],['Ruler','ruler',''],['Sequence','sequence','']].forEach(r=>b.addTrack(r,false,24));
 meta.forEach(row=>b.addTrack(row));
 b.setMode=value=>{b.mode=value;b.trackViews.forEach(tv=>{if(tv.box){tv.trackSelectionContainer.style.display=value?'grid':'none';if(!value){tv.box.checked=false;tv.track.selected=false;}}});};
 b.removeTrack=tv=>{b.trackViews=b.trackViews.filter(v=>v!==tv);for(const el of [tv.axis,...tv.viewports.map(v=>v.viewportElement),tv.sampleInfoViewport.viewport,tv.sampleNameViewport.viewport,tv.outerScroll,tv.dragHandle,tv.gearContainer])el.remove();};
 root.fixtureBrowser=b;return b;
};
window.fixtureBrowser=makeViewer(document.querySelector('#viewer-one'));
window.setMode=value=>{fixtureBrowser.setMode(value);document.querySelector('#mode').textContent=value?'Exit Selection':'Select Tracks';};
document.querySelector('#mode').onclick=()=>setMode(!fixtureBrowser.mode);
document.querySelector('#add').onclick=()=>fixtureBrowser.addTrack(['New_ATAC.bigWig','wig','bigwig']);
</script></body></html>
